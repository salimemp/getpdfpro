name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext bundle
        working-directory: apps/web
        # NEXT_PUBLIC_* must be in the process env at BUILD time so Next.js
        # inlines them into the client bundle. The wrangler.toml [vars] block
        # only sets them at Worker runtime — too late for the inlining step.
        # Values mirror apps/web/wrangler.toml [vars] (kept in sync manually).
        # These are the public anon key + URLs, not secrets, so plain text in
        # the workflow is fine.
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://osjtyipxwpkmzsextbne.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zanR5aXB4d3BrbXpzZXh0Ym5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzYzNDgsImV4cCI6MjA5Njk1MjM0OH0.95765gbqpjkedk5nfa9JdHa2b1BljGofRIMOk1nXxUA"
          NEXT_PUBLIC_API_URL: "https://api.getpdfpro.com"
          NEXT_PUBLIC_SITE_URL: "https://app.getpdfpro.com"
        run: pnpm opennext:build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec wrangler deploy .open-next/worker.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
