# Cloudflare Workers configuration for the getpdfpro-web app.
# 
# OpenNext 1.x is designed for Cloudflare Workers, not Pages.
# The build output is .open-next/worker.js + .open-next/assets/
# Workers serves the assets via the ASSETS binding, Pages doesn't support it.

name = "getpdfpro-web"
main = ".open-next/worker.js"
compatibility_date = "2026-04-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "enable_request_signal"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Plain-text env vars (non-sensitive). Read at runtime via process.env.
# For NEXT_PUBLIC_* vars, these ALSO get inlined into the client bundle at build time,
# but server-side code reads from process.env.
# Secrets like the anon key should be in [secrets] or via `wrangler secret put`,
# but NEXT_PUBLIC_* are public anyway, so [vars] is fine.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://osjtyipxwpkmzsextbne.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zanR5aXB4d3BrbXpzZXh0Ym5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzYzNDgsImV4cCI6MjA5Njk1MjM0OH0.95765gbqpjkedk5nfa9JdHa2b1BljGofRIMOk1nXxUA"
